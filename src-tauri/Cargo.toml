[package]
name = "buku-token"
version = "0.1.0"
description = "Menu bar app that shows AI agent quota and usage from local logs"
authors = ["Hafizh"]
license = "MIT"
repository = "https://github.com/fizipan/buku-token"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buku_token_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
security-framework = "3"
notify-debouncer-mini = "0.7.0"
resvg = "0.49.0"
tauri-plugin-autostart = "2.7.0"
tokio = { version = "1", features = ["time"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-notification = "2.8.0"
libc = "0.2.191"
core-foundation = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "macros"] }
